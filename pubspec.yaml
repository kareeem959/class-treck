name: class_track
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management
  flutter_bloc: ^8.1.6

  # Location & Geofencing
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Google Form In-App WebView
  webview_flutter: ^4.10.0

  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_native_splash:
  color: "#F8FAFC"
  image: assets/images/logo.png
  android_12:
    color: "#F8FAFC"
    image: assets/images/logo.png